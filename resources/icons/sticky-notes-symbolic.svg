<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Monochrome sticky-note glyph. The body is solid so the mark keeps the
       visual weight of a full-color tray icon at 16-22 px; the text lines are
       cut out (evenodd) so the panel background shows through. The
       ColorScheme-Text class lets Plasma recolor the icon with the panel
       palette when it is installed as sticky-notes-symbolic. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Text { color:#232629; }
  </style>
  <path class="ColorScheme-Text" fill="currentColor" fill-rule="evenodd"
        d="M5 2h14a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3z
           M5 6.6h14v1.6H5z
           M6.4 10.8h11.2v1.6H6.4z
           M6.4 14.4h11.2v1.6H6.4z
           M6.4 18h6.8v1.6H6.4z"/>
</svg>
